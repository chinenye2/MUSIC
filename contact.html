<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Contact Marisquti for bookings, press, and collaborations." />
    <meta name="theme-color" content="#f2efe8" />
    <title>Contact | Marisquti</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { --ink: #10151c; --paper: #f2efe8; --lime: #d8f86b; --muted: #687078; --line: rgba(16, 21, 28, 0.16); }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; color: var(--ink); background: linear-gradient(135deg, #f2efe8, #d9e5d7 58%, #c9dff0); font-family: 'DM Sans', sans-serif; }
      a { color: inherit; }
      .shell { width: min(1120px, calc(100% - 44px)); margin: 0 auto; padding: 28px 0 60px; }
      .nav { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
      .brand { display: flex; align-items: center; gap: 12px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; text-decoration: none; }
      .mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: var(--lime); }
      .nav-links { display: flex; gap: 18px; font-weight: 700; }
      .nav-links a { text-decoration: none; }
      .layout { display: grid; grid-template-columns: 0.85fr 1.15fr; gap: 60px; align-items: start; padding-top: 15vh; }
      .eyebrow { margin: 0 0 18px; color: var(--muted); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
      h1, h2 { font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.07em; }
      h1 { margin: 0; font-size: clamp(3rem, 8vw, 7rem); line-height: 0.9; }
      .intro { max-width: 420px; margin-top: 24px; color: #4c555b; font-size: 1.1rem; }
      .details { display: grid; gap: 16px; margin-top: 48px; }
      .details a { font-weight: 700; }
      .form-wrap { padding: 28px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,255,255,0.38); }
      h2 { margin: 0 0 22px; font-size: 2.2rem; }
      form { display: grid; gap: 14px; }
      label { display: grid; gap: 6px; color: var(--muted); font-size: 0.85rem; font-weight: 700; }
      input, textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 0.85rem; background: rgba(255,255,255,0.6); color: var(--ink); font: inherit; }
      textarea { min-height: 150px; resize: vertical; }
      button { border: 0; border-radius: 999px; padding: 0.85rem 1.2rem; background: var(--ink); color: var(--paper); font: inherit; font-weight: 700; cursor: pointer; }
      .status { min-height: 1.4em; color: var(--muted); }
      
      /* Enhanced responsive design for contact page */
      @media (max-width: 1024px) {
        .shell { width: min(100%, calc(100% - 40px)); padding: 24px 0 50px; }
        .layout { gap: 40px; padding-top: 12vh; }
        h1 { font-size: clamp(2.5rem, 7vw, 5rem); }
        .form-wrap { padding: 24px; }
      }

      @media (max-width: 768px) {
        .shell { width: calc(100% - 32px); padding: 20px 0 40px; }
        .nav { flex-direction: column; gap: 12px; text-align: center; }
        .nav-links { gap: 12px; font-size: 0.9rem; flex-wrap: wrap; justify-content: center; }
        .layout { grid-template-columns: 1fr; gap: 30px; padding-top: 10vh; }
        h1 { font-size: clamp(2rem, 8vw, 4rem); }
        .intro { font-size: 1rem; margin-top: 20px; }
        .details { margin-top: 32px; gap: 12px; }
        .form-wrap { padding: 20px; }
        h2 { font-size: 1.8rem; margin-bottom: 18px; }
        form { gap: 12px; }
        label { font-size: 0.8rem; }
        input, textarea { padding: 0.8rem; }
        textarea { min-height: 120px; }
        button { padding: 0.8rem 1.1rem; font-size: 0.9rem; }
      }

      @media (max-width: 640px) {
        .shell { width: calc(100% - 28px); padding: 18px 0 36px; }
        .mark { width: 36px; height: 36px; }
        .brand { font-size: 0.9rem; }
        .layout { gap: 24px; padding-top: 8vh; }
        .eyebrow { font-size: 0.7rem; }
        h1 { font-size: clamp(1.8rem, 9vw, 3.5rem); }
        .intro { font-size: 0.95rem; max-width: 100%; }
        .details { margin-top: 24px; }
        .form-wrap { padding: 18px; border-radius: 16px; }
        h2 { font-size: 1.5rem; margin-bottom: 16px; }
        form { gap: 10px; }
        label { font-size: 0.75rem; }
        input, textarea { padding: 0.75rem; font-size: 0.9rem; }
        textarea { min-height: 100px; }
        button { padding: 0.75rem 1rem; font-size: 0.85rem; width: 100%; }
        .status { font-size: 0.85rem; }
      }

      @media (max-width: 480px) {
        .shell { width: calc(100% - 24px); padding: 16px 0 32px; }
        .nav { gap: 10px; }
        .nav-links { gap: 8px; font-size: 0.85rem; }
        .mark { width: 32px; height: 32px; }
        .brand { font-size: 0.85rem; }
        .layout { gap: 20px; padding-top: 6vh; }
        .eyebrow { font-size: 0.65rem; }
        h1 { font-size: clamp(1.5rem, 10vw, 3rem); }
        .intro { font-size: 0.9rem; margin-top: 16px; }
        .details { margin-top: 20px; font-size: 0.9rem; }
        .form-wrap { padding: 16px; border-radius: 14px; }
        h2 { font-size: 1.3rem; margin-bottom: 14px; }
        form { gap: 8px; }
        label { font-size: 0.7rem; }
        input, textarea { padding: 0.7rem; font-size: 0.85rem; }
        textarea { min-height: 90px; }
        button { padding: 0.7rem 0.9rem; font-size: 0.8rem; }
      }

      @media (max-width: 360px) {
        .shell { width: calc(100% - 20px); padding: 14px 0 28px; }
        .layout { padding-top: 4vh; }
        h1 { font-size: clamp(1.3rem, 11vw, 2.5rem); }
        .form-wrap { padding: 14px; }
        h2 { font-size: 1.2rem; }
        input, textarea { padding: 0.65rem; }
        textarea { min-height: 80px; }
      }

      /* Landscape orientation */
      @media (max-height: 500px) and (orientation: landscape) {
        .shell { padding: 12px 0 24px; }
        .layout { padding-top: 4vh; gap: 20px; }
        h1 { font-size: clamp(1.5rem, 6vw, 3rem); }
        .intro { margin-top: 12px; font-size: 0.9rem; }
        .details { margin-top: 16px; }
        .form-wrap { padding: 16px; }
        h2 { font-size: 1.4rem; margin-bottom: 12px; }
        textarea { min-height: 80px; }
      }

      /* Touch device optimizations */
      @media (hover: none) and (pointer: coarse) {
        button:hover { transform: none; }
        button:active { transform: scale(0.98); }
        .nav-links a:active { color: var(--muted); }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <nav class="nav" aria-label="Main navigation">
        <a class="brand" href="/"><span class="mark">Mq</span><span>Marisquti</span></a>
        <div class="nav-links"><a href="/">Home</a><a href="/dashboard">Dashboard</a></div>
      </nav>
      <main class="layout">
        <section>
          <p class="eyebrow">Contact · bookings · press</p>
          <h1>Let’s make something worth hearing.</h1>
          <p class="intro">For bookings, collaborations, press, and other inquiries, send a message and the team will get back to you.</p>
          <div class="details"><span>booking@Marisquti.com</span><a href="https://music.apple.com/us/artist/maris-quti/1816755808" target="_blank" rel="noreferrer">Listen on Apple Music</a></div>
        </section>
        <section class="form-wrap">
          <h2>Send a message</h2>
          <form id="contactForm">
            <label>Your name or organization<input name="sender" required placeholder="Your name" /></label>
            <label>Email<input name="email" type="email" required placeholder="you@example.com" /></label>
            <label>Message<textarea name="message" required placeholder="Tell us how we can help."></textarea></label>
            <button type="submit">Send message</button>
            <p id="contactStatus" class="status" aria-live="polite"></p>
          </form>
        </section>
      </main>
    </div>
    <script>
      const form = document.getElementById('contactForm');
      const status = document.getElementById('contactStatus');
      const apiBase = ['5500', '5501'].includes(window.location.port) ? 'http://localhost:3003' : '';
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        status.textContent = 'Sending message...';
        const values = Object.fromEntries(new FormData(form));
        try {
          const response = await fetch(`${apiBase}/api/messages`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sender: `${values.sender} (${values.email})`, message: values.message }) });
          const text = await response.text();
          const data = text ? JSON.parse(text) : {};
          if (!response.ok) throw new Error(data.error || `Unable to send message (${response.status}) from ${response.url}.`);
          form.reset();
          status.textContent = 'Message sent successfully.';
        } catch (error) { status.textContent = error.message; }
      });
    </script>
  </body>
</html>
