<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Login to artist dashboard" />
  <meta name="theme-color" content="#0b1020" />
  <title>Login - Artist Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b1020;
      --bg-soft: #111a2d;
      --panel: rgba(17, 24, 39, 0.9);
      --line: rgba(148, 163, 184, 0.18);
      --text: #edf2ff;
      --muted: #a7b2c9;
      --accent: #7c6af9;
      --accent-2: #4ec8ff;
      --success: #48d597;
      --danger: #ff7b7b;
      --shadow: 0 24px 60px rgba(8, 12, 20, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0b1020 0%, #141d32 50%, #0d1220 100%);
      color: var(--text);
      font-family: "Inter", sans-serif;
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 40px 32px;
    }

    /* Responsive improvements for login page */
    @media (max-width: 640px) {
      body {
        padding: 16px;
      }

      .login-container {
        padding: 28px 24px;
        border-radius: 18px;
      }

      .logo {
        width: 56px;
        height: 56px;
        font-size: 1.3rem;
        margin-bottom: 16px;
      }

      .login-header h1 {
        font-size: 1.5rem;
      }

      .login-header p {
        font-size: 0.85rem;
      }

      .tab-buttons {
        margin-bottom: 20px;
        padding: 3px;
        border-radius: 10px;
      }

      .tab-button {
        padding: 10px 14px;
        font-size: 0.9rem;
      }

      .form-group {
        margin-bottom: 16px;
      }

      .form-group label {
        font-size: 0.85rem;
        margin-bottom: 6px;
      }

      .form-group input {
        padding: 12px 14px;
        font-size: 0.95rem;
        border-radius: 10px;
      }

      .button {
        padding: 14px 18px;
        font-size: 0.95rem;
        border-radius: 12px;
      }

      .error-message,
      .success-message {
        padding: 10px 14px;
        font-size: 0.85rem;
        border-radius: 10px;
        margin-bottom: 16px;
      }

      .back-link {
        margin-top: 20px;
      }

      .back-link a {
        font-size: 0.85rem;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .login-container {
        padding: 24px 20px;
        border-radius: 16px;
      }

      .logo {
        width: 48px;
        height: 48px;
        font-size: 1.1rem;
        margin-bottom: 14px;
      }

      .login-header {
        margin-bottom: 24px;
      }

      .login-header h1 {
        font-size: 1.3rem;
      }

      .login-header p {
        font-size: 0.8rem;
      }

      .tab-buttons {
        margin-bottom: 18px;
        gap: 6px;
      }

      .tab-button {
        padding: 10px 12px;
        font-size: 0.85rem;
        border-radius: 8px;
      }

      .form-group {
        margin-bottom: 14px;
      }

      .form-group label {
        font-size: 0.8rem;
      }

      .form-group input {
        padding: 11px 12px;
        font-size: 0.9rem;
      }

      .button {
        padding: 12px 16px;
        font-size: 0.9rem;
      }

      .error-message,
      .success-message {
        padding: 8px 12px;
        font-size: 0.8rem;
        margin-bottom: 14px;
      }
    }

    @media (max-width: 360px) {
      .login-container {
        padding: 20px 16px;
      }

      .logo {
        width: 44px;
        height: 44px;
        font-size: 1rem;
      }

      .login-header h1 {
        font-size: 1.2rem;
      }

      .tab-button {
        padding: 8px 10px;
        font-size: 0.8rem;
      }

      .form-group input {
        padding: 10px 11px;
      }

      .button {
        padding: 11px 14px;
      }
    }

    /* Landscape orientation */
    @media (max-height: 500px) and (orientation: landscape) {
      body {
        padding: 10px;
        align-items: flex-start;
      }

      .login-container {
        padding: 20px 24px;
        margin-top: 20px;
      }

      .logo {
        width: 40px;
        height: 40px;
        margin-bottom: 12px;
      }

      .login-header {
        margin-bottom: 16px;
      }

      .login-header h1 {
        font-size: 1.2rem;
      }

      .form-group {
        margin-bottom: 12px;
      }

      .button {
        padding: 10px 14px;
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      font-weight: 800;
      font-size: 1.5rem;
      color: white;
    }

    .login-header h1 {
      margin: 0 0 8px;
      font-size: 1.75rem;
      letter-spacing: -0.06em;
    }

    .login-header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .tab-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      background: rgba(255, 255, 255, 0.02);
      padding: 4px;
      border-radius: 12px;
    }

    .tab-button {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-button.active {
      background: rgba(124, 106, 249, 0.15);
      color: var(--text);
    }

    .tab-button:hover:not(.active) {
      background: rgba(255, 255, 255, 0.04);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      color: var(--text);
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(124, 106, 249, 0.05);
    }

    .form-group input::placeholder {
      color: rgba(167, 178, 201, 0.5);
    }

    .button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 14px 20px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      box-shadow: 0 14px 28px rgba(124, 106, 249, 0.35);
    }

    .button.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 32px rgba(124, 106, 249, 0.4);
    }

    .button.primary:active {
      transform: translateY(0);
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error-message {
      background: rgba(255, 123, 123, 0.1);
      border: 1px solid rgba(255, 123, 123, 0.3);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
      color: var(--danger);
      font-size: 0.9rem;
      display: none;
    }

    .error-message.visible {
      display: block;
    }

    .success-message {
      background: rgba(72, 213, 151, 0.1);
      border: 1px solid rgba(72, 213, 151, 0.3);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
      color: var(--success);
      font-size: 0.9rem;
      display: none;
    }

    .success-message.visible {
      display: block;
    }

    .back-link {
      text-align: center;
      margin-top: 24px;
    }

    .back-link a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s ease;
    }

    .back-link a:hover {
      color: var(--accent);
    }

    .loading {
      position: relative;
    }

    .loading::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      top: 50%;
      left: 50%;
      margin-top: -10px;
      margin-left: -10px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="logo">Mq</div>
      <h1>Artist Dashboard</h1>
      <p>Sign in to manage your EPK</p>
    </div>

    <div class="tab-buttons">
      <button class="tab-button active" data-tab="login">Sign In</button>
      <button class="tab-button" data-tab="register">Sign Up</button>
    </div>

    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" name="email" autocomplete="off" required />
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="password" autocomplete="off" required />
      </div>
      <button type="submit" class="button primary" id="loginButton">Sign In</button>
    </form>

    <form id="registerForm" class="hidden">
      <div class="form-group">
        <label for="registerEmail">Email</label>
        <input type="email" id="registerEmail" name="email" required />
      </div>
      <div class="form-group">
        <label for="registerName">Name (optional)</label>
        <input type="text" id="registerName" name="name" />
      </div>
      <div class="form-group">
        <label for="registerPassword">Password</label>
        <input type="password" id="registerPassword" name="password" required minlength="6" />
      </div>
      <button type="submit" class="button primary" id="registerButton">Create Account</button>
    </form>

    <div class="back-link">
      <a href="/">← Back to home</a>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const loginButton = document.getElementById('loginButton');
    const registerButton = document.getElementById('registerButton');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const tabButtons = document.querySelectorAll('.tab-button');

    const apiBase = ['5500', '5501'].includes(window.location.port) ? 'http://localhost:3003' : '';

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('visible');
      successMessage.classList.remove('visible');
    }

    function showSuccess(message) {
      successMessage.textContent = message;
      successMessage.classList.add('visible');
      errorMessage.classList.remove('visible');
    }

    function clearMessages() {
      errorMessage.classList.remove('visible');
      successMessage.classList.remove('visible');
    }

    function setLoading(button, isLoading) {
      if (isLoading) {
        button.classList.add('loading');
        button.disabled = true;
      } else {
        button.classList.remove('loading');
        button.disabled = false;
      }
    }

    tabButtons.forEach(button => {
      button.addEventListener('click', () => {
        const tab = button.dataset.tab;
        tabButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tab));
        
        if (tab === 'login') {
          loginForm.classList.remove('hidden');
          registerForm.classList.add('hidden');
        } else {
          loginForm.classList.add('hidden');
          registerForm.classList.remove('hidden');
        }
        
        clearMessages();
      });
    });

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearMessages();
      
      const formData = new FormData(loginForm);
      const data = Object.fromEntries(formData);
      
      setLoading(loginButton, true);
      
      try {
        const response = await fetch(`${apiBase}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (!response.ok) {
          throw new Error(result.error || 'Login failed');
        }
        
        showSuccess('Login successful! Redirecting...');
        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 1000);
      } catch (error) {
        showError(error.message);
      } finally {
        setLoading(loginButton, false);
      }
    });

    registerForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearMessages();
      
      const formData = new FormData(registerForm);
      const data = Object.fromEntries(formData);
      
      setLoading(registerButton, true);
      
      try {
        const response = await fetch(`${apiBase}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (!response.ok) {
          throw new Error(result.error || 'Registration failed');
        }
        
        showSuccess('Account created successfully! Redirecting...');
        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 1000);
      } catch (error) {
        showError(error.message);
      } finally {
        setLoading(registerButton, false);
      }
    });
  </script>
</body>
</html>
